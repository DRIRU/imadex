services:
  imadex:
    build: .
    image: imadex:local
    restart: unless-stopped
    # The container binds 0.0.0.0; the host binding below keeps it loopback-only.
    command: ["--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data:/app/data
    environment:
      # Set both in a .env file (see .env.example) to enable authenticated tunnel mode.
      FRAME_PUBLIC_ORIGIN: "${FRAME_PUBLIC_ORIGIN:-}"
      FRAME_PASSWORD: "${FRAME_PASSWORD:-}"
      # Leave empty to use embedded local Qdrant. Set to a server URL to use one.
      QDRANT_URL: "${QDRANT_URL:-}"
      QDRANT_API_KEY: "${QDRANT_API_KEY:-}"
      QDRANT_COLLECTION: "${QDRANT_COLLECTION:-}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.error, urllib.request
          try:
              urllib.request.urlopen("http://127.0.0.1:8765/api/status", timeout=5)
          except urllib.error.HTTPError:
              pass
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # CPU Qdrant server. Start with: docker compose --profile qdrant up --build
  # Point imadex at it with QDRANT_URL=http://qdrant:6333 in .env
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage

  # NVIDIA GPU Qdrant server (GPU accelerates indexing only, not search).
  # Linux x86_64 hosts only; requires the NVIDIA container toolkit.
  # Start with: docker compose --profile qdrant-gpu up --build
  # Point imadex at it with QDRANT_URL=http://qdrant-gpu:6333 in .env
  qdrant-gpu:
    image: qdrant/qdrant:gpu-nvidia-latest
    profiles: ["qdrant-gpu"]
    restart: unless-stopped
    environment:
      QDRANT__GPU__INDEXING: "1"
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
